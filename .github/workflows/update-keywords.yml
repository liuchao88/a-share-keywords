name: update-keywords

# 每周一 10:00（北京时间）让大模型从互动问答语料里给词库补几个新词。
# 只加词、不删词；任何失败都不改文件（脚本里已做兜底）。
# 想立刻跑一次：Actions → update-keywords → Run workflow。

on:
  schedule:
    - cron: '0 2 * * 1'        # GitHub cron 用 UTC → 北京时间周一 10:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keywords
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 让模型补词
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}   # 可选：配了就把周报推到企微群
        run: python scripts/update_keywords.py

      - name: 提交词库更新
        run: |
          git config user.name "keywords-bot"
          git config user.email "actions@users.noreply.github.com"
          git add keywords/
          git diff --cached --quiet || git commit -m "keywords auto-update $(date -u +%F)"
          git pull --rebase --autostash || true
          git push

      - name: 通知 jsdelivr 刷新缓存
        run: |
          for f in keywords/*.json; do
            curl -s "https://purge.jsdelivr.net/gh/liuchao88/a-share-keywords@main/$f" > /dev/null || true
          done
